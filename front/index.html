<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - VidaBalance</title>
   <!--estilos-->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" 
        crossorigin="anonymous" referrerpolicy="no-referrer" />
 
  <link rel="stylesheet" href="styles.css" />

   <!--logo de la pagina= -->
    <link rel="shortcut icon" href="./assets/fondo.png" type="image/x-icon">
</head>
<body>
  <h3> HOLA <i class="fa-solid fa-hand" style="color: #32fb18;"></i> bienvenido a VidaBalance</h3><style>h3 {
  font-family: "Georgia", serif; 
  font-style: italic; 
  text-align: center;
  font-weight: bold; 
}</style>
  <h1>VIDABALANCE</h1>
  <p>En VidaBalance manejamos tus tareas de manera eficiente y organizada para tu manejo de rutinas y actividades con recordatorios y experiencias inolvidables.</p>

<h4>por eso registrate aqui con nosotros</h4>
<i class="fa-solid fa-arrow-down fa-2xl center-arrow"></i>
<style>
h4 {
  font-family: "Georgia", serif;
  font-style: italic;
  text-align: center;
  font-weight: bold;
  animation: alternate-reverse;
  animation-duration: 2s;
  animation-iteration-count: infinite;
}
.center-arrow {
  color: #74C0FC;
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 0 auto;
  width: fit-content;
  font-size: 2em;
}
</style>

  <div class="container login-container">
    <h2>Bienvenido</h2>
     <div class="tabs">
      <button id="loginTab" class="active">Iniciar Sesión</button>
      <button id="registerTab">Registrarse</button>
    </div>
   
<!-- Login -->
<form id="loginForm">
  <input type="email" id="loginEmail" placeholder="Correo electrónico" required />
  <div class="password-container">
    <input type="password" id="loginPassword" placeholder="Contraseña" required />
    <button type="button" class="togglePassword" aria-label="Mostrar contraseña">👁️</button>
  </div>
  <button type="submit">Iniciar Sesión</button>
  <p id="loginError" class="error-msg"></p>
</form>

<!-- Registro -->
<form id="registerForm" style="display:none;">
  <input type="text" id="registerNombre" placeholder="Nombre completo" required />
  <input type="email" id="registerEmail" placeholder="Correo electrónico" required />
  <div class="password-container">
    <input type="password" id="registerPassword" placeholder="Contraseña" required />
    <button type="button" class="togglePassword" aria-label="Mostrar contraseña">👁️</button>
  </div>
  <input type="file" id="registerImagen" accept="image/*" />
  <button type="submit">Registrarse</button>
  <p id="registerError" class="error-msg"></p>
</form>
  </div>

<script src="app.js"></script>

</body>
</html>
