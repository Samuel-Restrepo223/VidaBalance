<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Actualizar Usuario - VidaBalance</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" 
        crossorigin="anonymous" referrerpolicy="no-referrer" />
  <!--logo de la pagina= -->
    <link rel="shortcut icon" href="./assets/fondo.png" type="image/x-icon">
</head>
<style>
  bod{
    background-color: beige;
  }
</style>
<body>
  <div class="container">
    <h1>Actualiza tus datos <i class="fa-solid fa-font-awesome" style="color: #B197FC;"></i></h1>
    <form id="updateUserForm">
      <input type="text" id="nombre" placeholder="Nombre completo" required />
      <input type="email" id="email" placeholder="Correo electrónico" required />
      <button type="submit">Actualizar</button>
      <p id="updateMessage"></p>
    </form>
  </div>

  <script src="updateUser.js" defer></script>
</body>
</html>
